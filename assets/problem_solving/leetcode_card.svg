<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="ps-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <style>
      .code { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="276" rx="14" fill="url(#ps-bg)" stroke="#f59e0b" stroke-width="1.5" opacity="0.9" />

  <!-- Section Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" class="code" fill="#f59e0b" font-size="14" font-weight="700">STATE 09 // DEVELOPER MODE: PROBLEM SOLVING</text>
    <text x="0" y="22" class="sans" fill="#94a3b8" font-size="13">"One more problem before I sleep..." — Continuous Algorithmic Mastery</text>
  </g>

  <!-- Left Stats Badges Grid -->
  <g transform="translate(40, 95)" class="code">
    <!-- Big Stat Counter -->
    <rect x="0" y="0" width="220" height="140" rx="10" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="1"/>
    <text x="110" y="55" class="sans" fill="#ffffff" font-size="44" font-weight="900" text-anchor="middle">300+</text>
    <text x="110" y="85" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="middle">PROBLEMS SOLVED</text>
    <text x="110" y="110" fill="#9ca3af" font-size="10" text-anchor="middle">DSA &amp; System Algorithms</text>

    <!-- Platform Cards -->
    <!-- LeetCode -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="200" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" fill="#fbbf24" font-size="13" font-weight="700">LeetCode</text>
      <text x="18" y="46" fill="#e2e8f0" font-size="11">Data Structures &amp; Algo</text>
    </g>

    <!-- GeeksforGeeks -->
    <g transform="translate(455, 0)">
      <rect x="0" y="0" width="200" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" fill="#34d399" font-size="13" font-weight="700">GeeksforGeeks</text>
      <text x="18" y="46" fill="#e2e8f0" font-size="11">Core Java &amp; CS Fundamentals</text>
    </g>

    <!-- CodeChef -->
    <g transform="translate(240, 78)">
      <rect x="0" y="0" width="200" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" fill="#60a5fa" font-size="13" font-weight="700">CodeChef</text>
      <text x="18" y="46" fill="#e2e8f0" font-size="11">Competitive Contests</text>
    </g>

    <!-- TCS CodeVita -->
    <g transform="translate(455, 78)">
      <rect x="0" y="0" width="200" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" fill="#c084fc" font-size="13" font-weight="700">TCS CodeVita</text>
      <text x="18" y="46" fill="#e2e8f0" font-size="11">Global Coding Challenge</text>
    </g>
  </g>

  <!-- Right Visual Illustration: Character Late-Night Desk -->
  <g transform="translate(730, 90)">
    <!-- Monitor Base & Glow -->
    <rect x="20" y="10" width="180" height="120" rx="8" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="28" y="18" width="164" height="104" rx="4" fill="#0f172a"/>
    <text x="38" y="40" class="code" fill="#f59e0b" font-size="10">ACCEPT (100%)</text>
    <text x="38" y="60" class="code" fill="#34d399" font-size="9">Runtime: 2ms</text>
    <text x="38" y="75" class="code" fill="#34d399" font-size="9">Beats 98.4% Java</text>
    <text x="38" y="95" class="code" fill="#64748b" font-size="8">Memory: O(1) space</text>

    <!-- Character Avatar Late Night Coding -->
    <g transform="translate(110, 140)">
      <ellipse cx="0" cy="0" r="22" fill="#e59866"/>
      <path d="M -22 -4 C -22 -24, 22 -24, 22 -4 Z" fill="#111827"/>
      <!-- Round Glasses -->
      <circle cx="-10" cy="-2" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="10" cy="-2" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Smile -->
      <path d="M -5 10 Q 0 14 5 10" fill="none" stroke="#9a3412" stroke-width="1.5"/>
    </g>
  </g>
</svg>
