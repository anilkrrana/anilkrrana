<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="wave-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <style>
      .code { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes hand-wave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(20deg); }
      }
      .waving-hand { transform-origin: bottom center; animation: hand-wave 1.2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="996" height="236" rx="14" fill="url(#footer-bg)" stroke="url(#wave-glow)" stroke-width="1.5" />

  <!-- Character Mascot Standing & Waving (State 10) -->
  <g transform="translate(100, 110)">
    <!-- Body Outfit -->
    <path d="M -25 35 Q 0 10 25 35 L 20 85 L -20 85 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <!-- Neck -->
    <rect x="-8" y="0" width="16" height="15" rx="3" fill="#d97706" opacity="0.8" />
    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="26" ry="28" fill="#e59866" />
    <!-- Hair -->
    <path d="M -26 -28 C -26 -52, 26 -52, 26 -28 C 20 -44, 10 -48, 0 -48 C -10 -48, -20 -44, -26 -28 Z" fill="#111827" />

    <!-- Round Glasses -->
    <circle cx="-12" cy="-24" r="10" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2" />
    <circle cx="12" cy="-24" r="10" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2" />
    <line x1="-2" y1="-24" x2="2" y2="-24" stroke="#38bdf8" stroke-width="2" />

    <!-- Eyes -->
    <circle cx="-12" cy="-24" r="2.5" fill="#111827" />
    <circle cx="12" cy="-24" r="2.5" fill="#111827" />

    <!-- Happy Smile -->
    <path d="M -8 -8 Q 0 -2 8 -8" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

    <!-- Waving Arm Visual -->
    <g transform="translate(28, 20)" class="waving-hand">
      <path d="M 0 0 L 25 -25 L 32 -18 L 10 10 Z" fill="#e59866" stroke="#d97706" stroke-width="1" />
      <!-- Hand -->
      <circle cx="30" cy="-22" r="7" fill="#e59866" />
    </g>
  </g>

  <!-- Right Content: Call to Action -->
  <g transform="translate(260, 65)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="110" y="17" class="code" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">STATE 10 // CONNECT &amp; BUILD</text>

    <text x="0" y="65" class="sans" fill="#ffffff" font-size="28" font-weight="800">Made it this far? Let's build something.</text>
    <text x="0" y="92" class="sans" fill="#94a3b8" font-size="14">Whether it's distributed Java backends, MuleSoft API integration, or Spring AI systems—let's connect!</text>

    <!-- Social Action Buttons -->
    <g transform="translate(0, 115)" class="code">
      <!-- Button 1 -->
      <rect x="0" y="0" width="130" height="34" rx="6" fill="#2563eb" />
      <text x="65" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">LinkedIn ↗</text>

      <!-- Button 2 -->
      <rect x="140" y="0" width="130" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="205" y="21" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Email Me ✉️</text>

      <!-- Button 3 -->
      <rect x="280" y="0" width="130" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="345" y="21" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">LeetCode 🧩</text>
    </g>
  </g>
</svg>
