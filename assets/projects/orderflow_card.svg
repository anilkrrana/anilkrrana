<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#070d1d" />
    </linearGradient>

    <linearGradient id="glow-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .code { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse-node {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.1); }
      }
      .node { animation: pulse-node 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Main Card Container -->
  <rect x="2" y="2" width="996" height="356" rx="14" fill="url(#card-bg)" stroke="url(#glow-border)" stroke-width="2" />

  <!-- Featured Badge -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="17" class="code" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">🚀 FEATURED SYSTEM</text>
  </g>

  <!-- Project Name & Tagline -->
  <g transform="translate(30, 85)">
    <text x="0" y="0" class="sans" fill="#ffffff" font-size="34" font-weight="800">OrderFlow</text>
    <text x="0" y="28" class="sans" fill="#94a3b8" font-size="15">Production-Grade E-Commerce Order Management &amp; Payment Processing Engine</text>

    <!-- Key Architecture Specs -->
    <g transform="translate(0, 55)" class="code" font-size="12">
      <!-- Spec 1 -->
      <rect x="0" y="0" width="220" height="45" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-size="10">ARCHITECTURE</text>
      <text x="14" y="36" fill="#38bdf8" font-weight="600">Event-Driven API</text>

      <!-- Spec 2 -->
      <rect x="230" y="0" width="220" height="45" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-size="10">PAYMENT INTEGRATION</text>
      <text x="14" y="36" fill="#34d399" font-weight="600">Razorpay Webhooks</text>

      <!-- Spec 3 -->
      <rect x="460" y="0" width="210" height="45" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="20" fill="#64748b" font-size="10">CACHE &amp; MIGRATION</text>
      <text x="14" y="36" fill="#f43f5e" font-weight="600">Redis + Flyway</text>
    </g>

    <!-- Tech Badges Grid -->
    <g transform="translate(0, 125)" class="code" font-size="11">
      <rect x="0" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="40" y="17" fill="#e2e8f0" text-anchor="middle">Java 21</text>

      <rect x="90" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="140" y="17" fill="#60a5fa" text-anchor="middle">Spring Boot</text>

      <rect x="200" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="260" y="17" fill="#c084fc" text-anchor="middle">Spring Security</text>

      <rect x="330" y="0" width="60" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="360" y="17" fill="#f59e0b" text-anchor="middle">JWT</text>

      <rect x="400" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="447" y="17" fill="#34d399" text-anchor="middle">PostgreSQL</text>

      <rect x="505" y="0" width="70" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="540" y="17" fill="#38bdf8" text-anchor="middle">Docker</text>

      <rect x="585" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="645" y="17" fill="#a7f3d0" text-anchor="middle">GitHub Actions</text>
    </g>

    <!-- Action Links / Button Visuals -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="220" height="38" rx="8" fill="#2563eb" />
      <text x="110" y="24" class="code" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">🔗 View Repository →</text>
    </g>
  </g>

  <!-- Right Side Architecture Flow Visualizer -->
  <g transform="translate(730, 45)">
    <!-- Architecture Diagram Container -->
    <rect x="0" y="0" width="230" height="270" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <text x="115" y="24" class="code" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">SYSTEM ARCHITECTURE</text>

    <!-- Node 1: Client API -->
    <rect x="35" y="45" width="160" height="35" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="115" y="67" class="code" fill="#e2e8f0" font-size="11" text-anchor="middle">REST Client / App</text>
    <line x1="115" y1="80" x2="115" y2="105" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Node 2: Spring Boot & Security -->
    <rect x="35" y="105" width="160" height="40" rx="6" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1"/>
    <text x="115" y="125" class="code" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Spring Boot 3.x</text>
    <text x="115" y="139" class="code" fill="#bfdbfe" font-size="9" text-anchor="middle">JWT Security Filter</text>

    <line x1="115" y1="145" x2="65" y2="175" stroke="#34d399" stroke-width="1.5" />
    <line x1="115" y1="145" x2="165" y2="175" stroke="#f43f5e" stroke-width="1.5" />

    <!-- Node 3: PostgreSQL -->
    <rect x="15" y="175" width="95" height="35" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="62" y="197" class="code" fill="#34d399" font-size="10" text-anchor="middle">PostgreSQL</text>

    <!-- Node 4: Redis -->
    <rect x="120" y="175" width="95" height="35" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="167" y="197" class="code" fill="#f43f5e" font-size="10" text-anchor="middle">Redis Cache</text>

    <!-- Node 5: Razorpay -->
    <rect x="35" y="225" width="160" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="115" y="244" class="code" fill="#f59e0b" font-size="10" text-anchor="middle">Razorpay Webhooks</text>
  </g>
</svg>
