<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="t-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="timeline-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#818cf8" />
      <stop offset="66%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <style>
      .code { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes active-glow {
        0%, 100% { fill: #34d399; }
        50% { fill: #6ee7b7; }
      }
      .active-node { animation: active-glow 2s infinite ease-in-out; }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="316" rx="14" fill="url(#t-bg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="40" y="45" class="code" fill="#38bdf8" font-size="14" font-weight="700">STATE 07 // CAREER ARCHITECTURE &amp; TIMELINE</text>

  <!-- Horizontal Timeline Bar -->
  <g transform="translate(60, 160)">
    <!-- Base Glow Track -->
    <line x1="0" y1="0" x2="880" y2="0" stroke="url(#timeline-line)" stroke-width="4" stroke-linecap="round" />

    <!-- Node 1: 2024 Education -->
    <g transform="translate(20, 0)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      
      <!-- Top Text -->
      <rect x="-80" y="-85" width="160" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="-65" class="code" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">🎓 2024</text>
      <text x="0" y="-47" class="sans" fill="#e2e8f0" font-size="11" text-anchor="middle">B.Tech in CSE</text>
      <text x="0" y="-35" class="code" fill="#94a3b8" font-size="9" text-anchor="middle">Computer Science Core</text>
    </g>

    <!-- Node 2: 2024 Joined Capgemini -->
    <g transform="translate(300, 0)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="3" />
      <circle cx="0" cy="0" r="4" fill="#818cf8" />

      <!-- Bottom Text -->
      <rect x="-85" y="30" width="170" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="50" class="code" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">🏢 2024</text>
      <text x="0" y="68" class="sans" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Joined Capgemini</text>
      <text x="0" y="80" class="code" fill="#94a3b8" font-size="9" text-anchor="middle">Software Engineer</text>
    </g>

    <!-- Node 3: 2025 Integration / MuleSoft -->
    <g transform="translate(580, 0)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#c084fc" stroke-width="3" />
      <circle cx="0" cy="0" r="4" fill="#c084fc" />

      <!-- Top Text -->
      <rect x="-95" y="-85" width="190" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="-65" class="code" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">⚙️ 2025</text>
      <text x="0" y="-47" class="sans" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Integration Engineering</text>
      <text x="0" y="-35" class="code" fill="#94a3b8" font-size="9" text-anchor="middle">MuleSoft &amp; Enterprise APIs</text>
    </g>

    <!-- Node 4: 2026 Senior Software Engineer -->
    <g transform="translate(850, 0)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#34d399" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#34d399" class="active-node" />

      <!-- Bottom Text -->
      <rect x="-100" y="30" width="200" height="60" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#34d399" stroke-width="1.5"/>
      <text x="0" y="50" class="code" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">🚀 2026</text>
      <text x="0" y="67" class="sans" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Senior Software Engineer</text>
      <text x="0" y="81" class="code" fill="#a7f3d0" font-size="9" text-anchor="middle">Java Backend + AI + System Design</text>
    </g>
  </g>
</svg>
