<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    
    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 0.3; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
      @keyframes typing-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .blinking-dot { animation: blink 2s infinite ease-in-out; }
      .floating-element { animation: float 4s infinite ease-in-out; }
      .cursor { animation: typing-cursor 1s infinite; }
      .status-pulse { transform-origin: center; animation: pulse-ring 2.5s infinite ease-in-out; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="100" r="180" fill="#00f2fe" opacity="0.08" filter="url(#glow-soft)" />
  <circle cx="1050" cy="300" r="200" fill="#bc8cff" opacity="0.07" filter="url(#glow-soft)" />
  <circle cx="600" cy="200" r="150" fill="#3b82f6" opacity="0.05" filter="url(#glow-soft)" />

  <!-- Top Glass Bar / Header Accent -->
  <rect x="20" y="20" width="1160" height="50" rx="10" fill="url(#glass-panel)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="45" cy="45" r="6" fill="#ef4444" />
  <circle cx="65" cy="45" r="6" fill="#f59e0b" />
  <circle cx="85" cy="45" r="6" fill="#10b981" />
  <text x="105" y="49" class="code-font" fill="#6b7280" font-size="12">anil-rana@command-center ~ % system_init.sh</text>

  <!-- Live Status Badge -->
  <g transform="translate(930, 32)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="15" cy="13" r="5" fill="#10b981" class="blinking-dot"/>
    <circle cx="15" cy="13" r="8" fill="none" stroke="#10b981" stroke-width="1" class="status-pulse"/>
    <text x="28" y="17" class="code-font" fill="#10b981" font-size="11" font-weight="600">● ONLINE | Open to Collab</text>
  </g>

  <!-- LEFT HERO CONTENT -->
  <g transform="translate(60, 110)">
    <!-- Tagline Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="14" y="18" class="code-font" fill="#60a5fa" font-size="12" font-weight="600">⚡ SENIOR SOFTWARE ENGINEER</text>

    <!-- Main Title -->
    <text x="0" y="70" class="sans-font" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="-0.5">Anil Rana</text>
    
    <!-- Subtitle with Gradient Pill -->
    <text x="0" y="102" class="code-font" fill="#9ca3af" font-size="16" font-weight="500">
      Java Backend <tspan fill="#38bdf8">•</tspan> MuleSoft <tspan fill="#38bdf8">•</tspan> Distributed Systems <tspan fill="#38bdf8">•</tspan> AI
    </text>

    <!-- Terminal Command snippet box -->
    <rect x="0" y="130" width="490" height="70" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="20" y="158" class="code-font" fill="#38bdf8" font-size="13">anil@capgemini:~$ <tspan fill="#f3f4f6">exec orderflow --env=production</tspan></text>
    <text x="20" y="182" class="code-font" fill="#10b981" font-size="12">[✓] Spring Boot 3.x | Mule Gateway | PostgreSQL | Redis <tspan class="cursor" fill="#10b981">█</tspan></text>

    <!-- Tech Pills -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="45" y="17" class="code-font" fill="#e2e8f0" font-size="11" text-anchor="middle">Java 21</text>

      <rect x="100" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="155" y="17" class="code-font" fill="#60a5fa" font-size="11" text-anchor="middle">Spring Boot</text>

      <rect x="220" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="267" y="17" class="code-font" fill="#c084fc" font-size="11" text-anchor="middle">MuleSoft</text>

      <rect x="325" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="372" y="17" class="code-font" fill="#34d399" font-size="11" text-anchor="middle">Spring AI</text>

      <rect x="430" y="0" width="70" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="465" y="17" class="code-font" fill="#f43f5e" font-size="11" text-anchor="middle">Redis</text>
    </g>
  </g>

  <!-- RIGHT HERO CONTENT: Character Guide Mascot Workstation (State 01) -->
  <g transform="translate(720, 85)" class="floating-element">
    <!-- Workstation Desk Glow Base -->
    <ellipse cx="200" cy="285" rx="190" ry="25" fill="#00f2fe" opacity="0.15" filter="url(#glow-soft)" />

    <!-- Futurist Desk Surface -->
    <polygon points="30,270 370,270 340,290 60,290" fill="rgba(30, 41, 59, 0.8)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Dual Monitor Glow Background -->
    <rect x="50" y="50" width="300" height="190" rx="12" fill="#090d16" stroke="url(#cyan-glow)" stroke-width="2" filter="url(#glow-cyan)" />
    
    <!-- Monitor Inner Display Screen -->
    <rect x="58" y="58" width="284" height="174" rx="8" fill="#0d1527" />

    <!-- Screen Code Lines Graphics -->
    <g class="code-font" font-size="9" opacity="0.9">
      <text x="70" y="78" fill="#60a5fa">// Anil Rana - Command Center v3.0</text>
      <text x="70" y="93" fill="#f43f5e">@RestController</text>
      <text x="70" y="108" fill="#e2e8f0"><tspan fill="#f59e0b">public class</tspan> OrderService {</text>
      <text x="85" y="123" fill="#60a5fa">@Autowired</text>
      <text x="85" y="138" fill="#e2e8f0">private PaymentProcessor payment;</text>
      <text x="85" y="153" fill="#34d399">@PostMapping<tspan fill="#e2e8f0">("/checkout")</tspan></text>
      <text x="85" y="168" fill="#e2e8f0">public Response execute() {</text>
      <text x="100" y="183" fill="#c084fc">return payment.processOrder();</text>
      <text x="85" y="198" fill="#e2e8f0">}</text>
      <text x="70" y="213" fill="#e2e8f0">}</text>
    </g>

    <!-- Holographic Floating Graph Overlay -->
    <rect x="230" y="70" width="100" height="70" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 240 120 Q 255 90 270 105 T 300 80 T 320 95" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="240" y="83" class="code-font" fill="#9ca3af" font-size="7">TPS / Latency</text>
    <text x="240" y="132" class="code-font" fill="#10b981" font-size="8">99.9% Uptime</text>

    <!-- CHARACTER MASCOT: ANIL RANA -->
    <path d="M 130 270 Q 200 240 270 270 L 260 285 L 140 285 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 160 250 L 240 250 L 250 270 L 150 270 Z" fill="#0f172a" />
    <rect x="186" y="225" width="28" height="22" rx="4" fill="#d97706" opacity="0.85"/>

    <!-- Head & Hair -->
    <ellipse cx="200" cy="195" rx="34" ry="38" fill="#e59866" />
    <ellipse cx="164" cy="195" rx="6" ry="8" fill="#d97706" />
    <ellipse cx="236" cy="195" rx="6" ry="8" fill="#d97706" />
    <path d="M 164 185 C 164 150, 236 150, 236 185 C 230 162, 210 156, 200 156 C 185 156, 170 162, 164 185 Z" fill="#111827" />
    <path d="M 166 180 Q 200 160 234 180 Q 200 170 166 180 Z" fill="#1f2937" />

    <!-- Glasses (CHARACTER SIGNATURE REQUIREMENT: Perfect Round Circular Glasses) -->
    <circle cx="184" cy="192" r="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="216" cy="192" r="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="197" y1="192" x2="203" y2="192" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="164" y1="192" x2="171" y2="192" stroke="#38bdf8" stroke-width="2" />
    <line x1="229" y1="192" x2="236" y2="192" stroke="#38bdf8" stroke-width="2" />

    <!-- Eyes (Friendly & Focused) -->
    <circle cx="184" cy="192" r="3.5" fill="#111827" />
    <circle cx="216" cy="192" r="3.5" fill="#111827" />
    <circle cx="185" cy="190" r="1" fill="#ffffff" />
    <circle cx="217" cy="190" r="1" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 174 175 Q 184 172 192 175" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
    <path d="M 208 175 Q 216 172 226 175" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />

    <!-- Nose & Confident Smile -->
    <path d="M 200 193 L 198 202 L 202 202" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 190 213 Q 200 220 210 213" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

    <!-- Coffee Mug on Workstation -->
    <g transform="translate(320, 250)">
      <rect x="0" y="0" width="18" height="22" rx="3" fill="#3b82f6" />
      <path d="M 18 5 C 24 5, 24 17, 18 17" fill="none" stroke="#3b82f6" stroke-width="2" />
      <path d="M 5 -4 Q 8 -10 4 -14" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" class="blinking-dot" />
      <path d="M 12 -2 Q 15 -8 11 -12" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" class="blinking-dot" />
    </g>

    <!-- Speech Bubble / Guide Persona Callout -->
    <g transform="translate(10, 15)">
      <rect x="0" y="0" width="170" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <polygon points="120,40 135,40 130,48" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <rect x="119" y="38" width="17" height="4" fill="#1e293b" />
      <text x="12" y="18" class="code-font" fill="#38bdf8" font-size="10" font-weight="700">👋 Welcome to my stack!</text>
      <text x="12" y="32" class="code-font" fill="#9ca3af" font-size="9">Don't scroll yet... explore ↓</text>
    </g>
  </g>
</svg>
