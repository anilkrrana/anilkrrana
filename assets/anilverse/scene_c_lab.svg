<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-c-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes code-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
      .pulse { animation: code-pulse 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#sc-c-bg)" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" class="code-font" fill="#00f2fe" font-size="12" font-weight="700">ANILVERSE // SCENE C — INSIDE THE ENGINEERING LAB</text>
    <text x="0" y="28" class="sans-font" fill="#ffffff" font-size="28" font-weight="800">Architecting High-Throughput Enterprise Backend Systems</text>
    <text x="0" y="50" class="sans-font" fill="#94a3b8" font-size="14">Java 21 • Spring Boot • MuleSoft API-Led Connectivity • Event-Driven Integrations • AI</text>
  </g>

  <!-- LEFT: REAL CODE EDITOR & ARCHITECTURE PANEL -->
  <g transform="translate(60, 115)">
    <!-- IDE Window Frame -->
    <rect x="0" y="0" width="680" height="270" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- IDE Title Bar -->
    <rect x="0" y="0" width="680" height="34" rx="10" fill="#1e293b" />
    <circle cx="20" cy="17" r="5" fill="#f87171" />
    <circle cx="38" cy="17" r="5" fill="#fbbf24" />
    <circle cx="56" cy="17" r="5" fill="#34d399" />
    <text x="340" y="21" class="code-font" fill="#94a3b8" font-size="11" text-anchor="middle">OrderIntegrationService.java — Capgemini Enterprise Core</text>

    <!-- Programmatic Real Java & MuleSoft Code Lines -->
    <g transform="translate(20, 55)" class="code-font" font-size="11">
      <text x="0" y="0" fill="#64748b">// Production Backend Architecture - Spring Boot 3 &amp; MuleSoft API Gateway</text>
      <text x="0" y="20" fill="#f43f5e">@RestController</text>
      <text x="0" y="38" fill="#f43f5e">@RequestMapping<tspan fill="#e2e8f0">("/api/v1/integration")</tspan></text>
      <text x="0" y="56" fill="#ffffff"><tspan fill="#f59e0b">public class</tspan> OrderIntegrationService {</text>
      
      <text x="20" y="76" fill="#60a5fa">@Autowired</text>
      <text x="20" y="94" fill="#ffffff">private MuleGatewayClient muleGateway;</text>
      
      <text x="20" y="114" fill="#60a5fa">@PostMapping<tspan fill="#e2e8f0">("/process-order")</tspan></text>
      <text x="20" y="132" fill="#ffffff"><tspan fill="#f59e0b">public</tspan> ResponseEntity&lt;OrderResponse&gt; handleOrder(<tspan fill="#60a5fa">@RequestBody</tspan> OrderRequest req) {</text>
      
      <text x="40" y="152" fill="#34d399">// Execute API-Led Connectivity Flow via MuleSoft DataWeave</text>
      <text x="40" y="170" fill="#ffffff">OrderResult result = muleGateway.transformAndDispatch(req);</text>
      <text x="40" y="188" fill="#c084fc">return</text> ResponseEntity.ok(OrderResponse.success(result));
      <text x="20" y="204" fill="#ffffff">}</text>
      <text x="0" y="220" fill="#ffffff">}</text>
    </g>
  </g>

  <!-- RIGHT: CHARACTER MASCOT CODING AT LAB WORKSTATION -->
  <g transform="translate(770, 115)">
    <!-- Lab Background Panel -->
    <rect x="0" y="0" width="370" height="270" rx="10" fill="#090d16" stroke="url(#cyan-accent)" stroke-width="1.5" />
    <text x="185" y="28" class="code-font" fill="#00f2fe" font-size="11" font-weight="700" text-anchor="middle">LIVE LAB ENGINE</text>

    <!-- Visual Architecture Flow Diagram -->
    <g transform="translate(30, 45)" class="code-font" font-size="10">
      <!-- Node 1: Client API -->
      <rect x="0" y="0" width="140" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="70" y="20" fill="#e2e8f0" text-anchor="middle">Client API Request</text>

      <path d="M 140 16 L 170 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Node 2: Mule Gateway -->
      <rect x="170" y="0" width="140" height="32" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="240" y="20" fill="#ffffff" font-weight="700" text-anchor="middle">MuleSoft Gateway</text>

      <path d="M 70 32 L 70 60" fill="none" stroke="#34d399" stroke-width="2" />
      <path d="M 240 32 L 240 60" fill="none" stroke="#a855f7" stroke-width="2" />

      <!-- Node 3: Spring Boot -->
      <rect x="0" y="60" width="140" height="32" rx="6" fill="#15803d" stroke="#34d399" stroke-width="1"/>
      <text x="70" y="80" fill="#ffffff" font-weight="700" text-anchor="middle">Spring Boot 3.x</text>

      <!-- Node 4: DataWeave / Redis -->
      <rect x="170" y="60" width="140" height="32" rx="6" fill="#6b21a8" stroke="#a855f7" stroke-width="1"/>
      <text x="240" y="80" fill="#ffffff" font-weight="700" text-anchor="middle">DataWeave &amp; Redis</text>
    </g>

    <!-- ANIL RANA MASCOT (CANONICAL STYLE AT DESK) -->
    <g transform="translate(185, 185)">
      <!-- Head -->
      <ellipse cx="0" cy="0" r="28" fill="#e59866"/>
      <ellipse cx="-28" cy="0" rx="4" ry="6" fill="#d97706"/>
      <ellipse cx="28" cy="0" rx="4" ry="6" fill="#d97706"/>

      <!-- Clean Hair -->
      <path d="M -28 -8 C -28 -34, 28 -34, 28 -8 C 22 -26, 12 -30, 0 -30 C -12 -30, -22 -26, -28 -8 Z" fill="#111827"/>

      <!-- Distinctive Perfectly Round Glasses -->
      <circle cx="-13" cy="-4" r="11" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="13" cy="-4" r="11" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="2"/>
      <line x1="-2" y1="-4" x2="2" y2="-4" stroke="#00f2fe" stroke-width="2"/>

      <!-- Eyes Focused on Code -->
      <circle cx="-13" cy="-4" r="2.5" fill="#111827"/>
      <circle cx="13" cy="-4" r="2.5" fill="#111827"/>

      <!-- Smile -->
      <path d="M -8 13 Q 0 18 8 13" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Hoodie Torso at Laptop -->
      <path d="M -35 28 Q 0 12 35 28 L 30 75 L -30 75 Z" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    </g>
  </g>
</svg>
