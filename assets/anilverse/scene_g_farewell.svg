<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <linearGradient id="farewell-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <style>
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes wave-hand { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(20deg); } }
      .waving { transform-origin: 155px 140px; animation: wave-hand 1.4s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#sc-g-bg)" stroke="url(#farewell-glow)" stroke-width="2" />

  <!-- LEFT: CHARACTER MASCOT WAVING FAREWELL (SCENE G) -->
  <g transform="translate(100, 100)">
    <!-- Closed Laptop on Desk -->
    <rect x="-30" y="110" width="180" height="10" rx="3" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
    
    <!-- Torso Outfit -->
    <path d="M 30 110 Q 60 70 90 110 L 80 160 L 40 160 Z" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    
    <!-- Neck -->
    <rect x="52" y="55" width="16" height="18" rx="3" fill="#d97706" opacity="0.8" />
    
    <!-- Head -->
    <ellipse cx="60" cy="30" rx="28" ry="30" fill="#e59866" />
    <ellipse cx="32" cy="30" rx="4" ry="6" fill="#d97706" />
    <ellipse cx="88" cy="30" rx="4" ry="6" fill="#d97706" />

    <!-- Hair -->
    <path d="M 32 22 C 32 -4, 88 -4, 88 22 C 82 4, 72 0, 60 0 C 48 0, 38 4, 32 22 Z" fill="#111827" />

    <!-- Distinctive Round Glasses -->
    <circle cx="47" cy="26" r="11" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="2" />
    <circle cx="73" cy="26" r="11" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="2" />
    <line x1="58" y1="26" x2="62" y2="26" stroke="#00f2fe" stroke-width="2" />

    <!-- Eyes -->
    <circle cx="47" cy="26" r="2.5" fill="#111827" />
    <circle cx="73" cy="26" r="2.5" fill="#111827" />

    <!-- Happy Smile -->
    <path d="M 51 44 Q 60 50 69 44" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

    <!-- Waving Arm Visual -->
    <g class="waving">
      <path d="M 90 80 L 125 50 L 133 58 L 100 90 Z" fill="#e59866" stroke="#d97706" stroke-width="1" />
      <circle cx="130" cy="52" r="8" fill="#e59866" />
    </g>
  </g>

  <!-- RIGHT: FAREWELL HEADLINE & ACTION CALLOUT -->
  <g transform="translate(290, 70)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" />
    <text x="110" y="17" class="code-font" fill="#00f2fe" font-size="11" font-weight="700" text-anchor="middle">ANILVERSE // SCENE G: FAREWELL</text>

    <text x="0" y="70" class="sans-font" fill="#ffffff" font-size="34" font-weight="800">Found something interesting?</text>
    <text x="0" y="100" class="sans-font" fill="#94a3b8" font-size="16">Let's turn good ideas into great software.</text>
    <text x="0" y="125" class="code-font" fill="#38bdf8" font-size="13">Open to Java Backend, MuleSoft Integration &amp; AI Collaborations.</text>

    <!-- Social Action Badges Visual -->
    <g transform="translate(0, 155)" class="code-font" font-size="11">
      <rect x="0" y="0" width="110" height="34" rx="6" fill="#2563eb" />
      <text x="55" y="21" fill="#ffffff" font-weight="700" text-anchor="middle">LinkedIn ↗</text>

      <rect x="120" y="0" width="110" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="175" y="21" fill="#e2e8f0" font-weight="600" text-anchor="middle">Portfolio 🌐</text>

      <rect x="240" y="0" width="110" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="295" y="21" fill="#34d399" font-weight="600" text-anchor="middle">Email ✉️</text>

      <rect x="360" y="0" width="110" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="415" y="21" fill="#fbbf24" font-weight="600" text-anchor="middle">LeetCode 🧩</text>
    </g>
  </g>
</svg>
