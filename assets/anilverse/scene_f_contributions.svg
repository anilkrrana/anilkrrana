<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-f-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d19" />
      <stop offset="50%" stop-color="#10172a" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <linearGradient id="tile-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <style>
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#sc-f-bg)" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" class="code-font" fill="#00f2fe" font-size="12" font-weight="700">ANILVERSE // SCENE F — THE CONTRIBUTION UNIVERSE</text>
    <text x="0" y="26" class="sans-font" fill="#ffffff" font-size="28" font-weight="800">Algorithmic Problem Solving &amp; Open Source Metrics</text>
  </g>

  <!-- LEFT: PROBLEM SOLVING & STATS TILES -->
  <g transform="translate(60, 105)">
    <!-- Big Stat Box -->
    <rect x="0" y="0" width="240" height="175" rx="10" fill="#0f172a" stroke="url(#tile-glow)" stroke-width="1.5" />
    <text x="120" y="65" class="sans-font" fill="#ffffff" font-size="52" font-weight="900" text-anchor="middle">300+</text>
    <text x="120" y="98" class="code-font" fill="#00f2fe" font-size="13" font-weight="700" text-anchor="middle">PROBLEMS SOLVED</text>
    <text x="120" y="125" class="sans-font" fill="#94a3b8" font-size="11" text-anchor="middle">LeetCode • GeeksforGeeks</text>
    <text x="120" y="142" class="sans-font" fill="#94a3b8" font-size="11" text-anchor="middle">CodeChef • TCS CodeVita</text>

    <!-- Platform Cards Grid -->
    <!-- LeetCode -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="240" height="78" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" class="code-font" fill="#fbbf24" font-size="14" font-weight="700">LeetCode</text>
      <text x="20" y="54" class="sans-font" fill="#e2e8f0" font-size="12">Data Structures &amp; Algorithms</text>
    </g>

    <!-- GeeksforGeeks -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="240" height="78" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" class="code-font" fill="#34d399" font-size="14" font-weight="700">GeeksforGeeks</text>
      <text x="20" y="54" class="sans-font" fill="#e2e8f0" font-size="12">Core Java &amp; CS Practice</text>
    </g>

    <!-- System Design & Microservices -->
    <g transform="translate(260, 97)">
      <rect x="0" y="0" width="240" height="78" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" class="code-font" fill="#38bdf8" font-size="14" font-weight="700">System Design</text>
      <text x="20" y="54" class="sans-font" fill="#e2e8f0" font-size="12">Distributed API Patterns</text>
    </g>

    <!-- MuleSoft Integration -->
    <g transform="translate(520, 97)">
      <rect x="0" y="0" width="240" height="78" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" class="code-font" fill="#c084fc" font-size="14" font-weight="700">MuleSoft Integration</text>
      <text x="20" y="54" class="sans-font" fill="#e2e8f0" font-size="12">API-Led Connectivity</text>
    </g>
  </g>

  <!-- RIGHT: CHARACTER MASCOT AT CONTRIBUTION WALL -->
  <g transform="translate(1030, 190)">
    <!-- Head -->
    <ellipse cx="0" cy="0" r="30" fill="#e59866"/>
    <ellipse cx="-30" cy="0" rx="4" ry="6" fill="#d97706"/>
    <ellipse cx="30" cy="0" rx="4" ry="6" fill="#d97706"/>

    <!-- Clean Hair -->
    <path d="M -30 -10 C -30 -36, 30 -36, 30 -10 C 24 -28, 12 -32, 0 -32 C -12 -32, -24 -28, -30 -10 Z" fill="#111827"/>

    <!-- Round Glasses -->
    <circle cx="-14" cy="-4" r="12" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="14" cy="-4" r="12" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="2"/>
    <line x1="-2" y1="-4" x2="2" y2="-4" stroke="#00f2fe" stroke-width="2"/>

    <!-- Eyes -->
    <circle cx="-14" cy="-4" r="2.5" fill="#111827"/>
    <circle cx="14" cy="-4" r="2.5" fill="#111827"/>

    <!-- Smile -->
    <path d="M -8 14 Q 0 19 8 14" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"/>

    <!-- Navy Hoodie Torso -->
    <path d="M -38 30 Q 0 15 38 30 L 32 80 L -32 80 Z" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
  </g>
</svg>
