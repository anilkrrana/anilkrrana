<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Midnight Blue Background Palette -->
    <linearGradient id="an-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Cyan & Violet Soft Neon Accents -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes float-idle { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes hand-wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(18deg); } }
      .blinking { animation: blink 2s infinite ease-in-out; }
      .floating { animation: float-idle 4s infinite ease-in-out; }
      .waving { transform-origin: 235px 230px; animation: hand-wave 1.6s infinite ease-in-out; }
      .code-font { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="440" rx="16" fill="url(#bg)" />
  <rect width="1200" height="440" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="440" rx="16" fill="url(#grid-pattern)" />

  <!-- Ambient Light Lighting Orbs -->
  <circle cx="180" cy="120" r="160" fill="#00f2fe" opacity="0.06" filter="url(#soft-shadow)" />
  <circle cx="1020" cy="220" r="180" fill="#a855f7" opacity="0.07" filter="url(#soft-shadow)" />

  <!-- Glass Border Overlay Frame -->
  <rect x="15" y="15" width="1170" height="410" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- LEFT EDITORIAL HERO SECTION -->
  <g transform="translate(65, 80)">
    <!-- ANILVERSE Universe Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
    <text x="14" y="18" class="code-font" fill="#38bdf8" font-size="11" font-weight="700">🌌 ANILVERSE // CHAPTER 01</text>

    <!-- Main Headline -->
    <text x="0" y="75" class="sans-font" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1">Hey, I'm Anil Rana 👋</text>
    
    <!-- Subtitle -->
    <text x="0" y="112" class="sans-font" fill="#94a3b8" font-size="18" font-weight="500">
      Building reliable systems. Exploring intelligent software.
    </text>

    <!-- Professional Identity Description Box -->
    <rect x="0" y="140" width="540" height="95" rx="10" fill="url(#glass-card)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="24" y="172" class="sans-font" fill="#e2e8f0" font-size="14" font-weight="600">Senior Software Engineer @ Capgemini</text>
    <text x="24" y="196" class="code-font" fill="#38bdf8" font-size="12">Java Backend <tspan fill="#64748b">•</tspan> Spring Boot <tspan fill="#64748b">•</tspan> MuleSoft Integration <tspan fill="#64748b">•</tspan> AI</text>
    <text x="24" y="218" class="sans-font" fill="#94a3b8" font-size="12">Architecting enterprise APIs, event-driven payment flows &amp; intelligent agents.</text>

    <!-- Status Indicator Pill -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#10b981" class="blinking"/>
      <text x="32" y="21" class="code-font" fill="#10b981" font-size="11" font-weight="600">● LIVE | Welcome to my universe</text>
    </g>
  </g>

  <!-- RIGHT SCENE A: CHARACTER AT FUTURISTIC STUDIO WORKSTATION -->
  <g transform="translate(730, 75)" class="floating">
    <!-- Workstation Desk Base -->
    <ellipse cx="200" cy="300" rx="190" ry="24" fill="#00f2fe" opacity="0.12" filter="url(#soft-shadow)" />
    <polygon points="20,285 380,285 350,305 50,305" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Dual Monitor Visual Setup -->
    <rect x="50" y="55" width="300" height="195" rx="12" fill="#090d16" stroke="url(#cyan-glow)" stroke-width="2" />
    <rect x="58" y="63" width="284" height="179" rx="8" fill="#0d1527" />

    <!-- Screen Code Lines Graphic -->
    <g class="code-font" font-size="9" opacity="0.85">
      <text x="70" y="85" fill="#38bdf8">// Anilverse Entrance Module</text>
      <text x="70" y="102" fill="#f43f5e">@SpringBootApplication</text>
      <text x="70" y="119" fill="#ffffff"><tspan fill="#f59e0b">public class</tspan> AnilverseEngine {</text>
      <text x="85" y="136" fill="#60a5fa">@EventListener(VisitorEvent.class)</text>
      <text x="85" y="153" fill="#ffffff">public void greetVisitor() {</text>
      <text x="100" y="170" fill="#34d399">Character.wave("Welcome!");</text>
      <text x="85" y="187" fill="#ffffff">}</text>
      <text x="70" y="204" fill="#ffffff">}</text>
    </g>

    <!-- CHARACTER MASCOT: ANIL RANA (CANONICAL STYLE) -->
    <!-- Torso: Navy Blue Hoodie with Cyan Accent Piping -->
    <path d="M 130 285 Q 200 250 270 285 L 260 300 L 140 300 Z" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <path d="M 160 265 L 240 265 L 250 285 L 150 285 Z" fill="#0f172a" />
    
    <!-- Neck -->
    <rect x="187" y="235" width="26" height="24" rx="4" fill="#d97706" opacity="0.85"/>

    <!-- Head -->
    <ellipse cx="200" cy="205" rx="34" ry="38" fill="#e59866" />
    <ellipse cx="164" cy="205" rx="5" ry="8" fill="#d97706" />
    <ellipse cx="236" cy="205" rx="5" ry="8" fill="#d97706" />

    <!-- Clean Dark Short Haircut -->
    <path d="M 164 195 C 164 160, 236 160, 236 195 C 230 172, 210 166, 200 166 C 185 166, 170 172, 164 195 Z" fill="#111827" />
    <path d="M 166 190 Q 200 170 234 190 Q 200 180 166 190 Z" fill="#1f2937" />

    <!-- CHARACTER SIGNATURE: DISTINCTIVE PERFECTLY ROUND CIRCULAR GLASSES WITH THIN DARK-CYAN FRAMES -->
    <circle cx="184" cy="202" r="13" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="2.2" />
    <circle cx="216" cy="202" r="13" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="2.2" />
    <line x1="197" y1="202" x2="203" y2="202" stroke="#00f2fe" stroke-width="2.2" />
    <line x1="164" y1="202" x2="171" y2="202" stroke="#00f2fe" stroke-width="2" />
    <line x1="229" y1="202" x2="236" y2="202" stroke="#00f2fe" stroke-width="2" />

    <!-- Eyes (Friendly & Looking Toward Visitor) -->
    <circle cx="184" cy="202" r="3.5" fill="#111827" />
    <circle cx="216" cy="202" r="3.5" fill="#111827" />
    <circle cx="185" cy="200" r="1" fill="#ffffff" />
    <circle cx="217" cy="200" r="1" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 174 185 Q 184 182 192 185" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
    <path d="M 208 185 Q 216 182 226 185" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />

    <!-- Confident Smile -->
    <path d="M 190 222 Q 200 229 210 222" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

    <!-- Animated Waving Hand Gesture -->
    <g class="waving">
      <path d="M 235 250 L 265 220 L 275 228 L 245 260 Z" fill="#e59866" stroke="#d97706" stroke-width="1" />
      <circle cx="270" cy="218" r="8" fill="#e59866" />
    </g>

    <!-- Speech Callout -->
    <g transform="translate(10, 15)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1" />
      <polygon points="130,38 145,38 140,45" fill="#0f172a" stroke="#00f2fe" stroke-width="1" />
      <rect x="129" y="36" width="17" height="4" fill="#0f172a" />
      <text x="14" y="17" class="code-font" fill="#00f2fe" font-size="10" font-weight="700">👋 Welcome to my world!</text>
      <text x="14" y="30" class="code-font" fill="#94a3b8" font-size="9">Step inside ANILVERSE ↓</text>
    </g>
  </g>
</svg>
